<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalTransact Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">
<nav class="bg-indigo-900 text-white p-4 shadow-lg">
    <div class="container mx-auto flex items-center gap-2">
        <i class="fas fa-shield-alt text-xl"></i>
        <h1 class="text-xl font-bold tracking-wider">PALTRANSACT</h1>
    </div>
</nav>

<main class="container mx-auto mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8 px-4">

    <!-- Transaction Form -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-semibold mb-4 border-b pb-2"><i class="fas fa-paper-plane mr-2 text-indigo-600"></i>New Transaction</h2>
        <form id="transactionForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Account ID</label>
                <input type="text" id="accountId" required placeholder="e.g. ACC-123" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2 focus:border-indigo-500 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Amount</label>
                <input type="number" id="amount" required step="0.01" min="0.01" placeholder="0.00" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2 focus:border-indigo-500 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Currency</label>
                <select id="currency" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2 focus:border-indigo-500 focus:ring-indigo-500">
                    <option value="INR">INR (₹)</option>
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="JPY">JPY (¥)</option>
                    <option value="AUD">AUD ($)</option>
                    <option value="CAD">CAD ($)</option>
                    <option value="SGD">SGD ($)</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-colors font-medium">
                Process Transaction
            </button>
        </form>
    </section>

    <!-- Transaction Log -->
    <section class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-lg font-semibold"><i class="fas fa-list mr-2 text-indigo-600"></i>Transaction Log</h2>
            <button onclick="loadTransactions()" class="text-slate-500 hover:text-indigo-600 transition-colors">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Account</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Amount</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Time</th>
                </tr>
                </thead>
                <tbody id="transactionTableBody" class="bg-white divide-y divide-slate-200">
                <!-- Rows populated by JS -->
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
    const API_URL = 'http://localhost:8080/api/v1/transactions';

    // Load transactions on page load
    document.addEventListener('DOMContentLoaded', loadTransactions);

    // Handle form submission
    document.getElementById('transactionForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            accountId: document.getElementById('accountId').value,
            amount: parseFloat(document.getElementById('amount').value),
            currency: document.getElementById('currency').value
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById('transactionForm').reset();
                loadTransactions();
            } else {
                alert('Error processing transaction');
            }
        } catch (error) {
            console.error('Network error:', error);
            alert('Backend server is unreachable. Is Spring Boot running?');
        }
    });

    // Fetch and display transactions
    async function loadTransactions() {
        try {
            const response = await fetch(API_URL);
            const transactions = await response.json();

            const tableBody = document.getElementById('transactionTableBody');
            tableBody.innerHTML = '';

            transactions.forEach(tx => {
                const statusBadge = tx.status === 'APPROVED'
                    ? `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800"><i class="fas fa-check-circle mr-1 mt-0.5"></i> Approved</span>`
                    : `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800"><i class="fas fa-exclamation-triangle mr-1 mt-0.5"></i> Review</span>`;

                const date = new Date(tx.timestamp).toLocaleString();
                const amountFormatted = new Intl.NumberFormat('en-IN', { style: 'currency', currency: tx.currency }).format(tx.amount);

                const row = `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">${tx.accountId}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 font-mono">${amountFormatted}</td>
                            <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${date}</td>
                        </tr>
                    `;
                tableBody.insertAdjacentHTML('beforeend', row);
            });
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }
</script>
</body>
</html>
